<nav aria-label="Form progress">
  <ol class="flex flex-wrap items-center gap-2">
    @for (s of steps(); track s.label; let i = $index; let last = $last) {
      <li class="flex items-center gap-2">
        <button type="button" class="flex items-center gap-2 rounded-lg px-2 py-1.5 text-sm font-semibold transition-colors hover:bg-mist"
          [class.text-accent]="i === current()" [class.text-ink-soft]="i !== current()" [attr.aria-current]="i === current() ? 'step' : null"
          (click)="select.emit(i)">
          <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border text-xs"
            [class]="s.invalid ? 'border-danger bg-danger-soft text-danger' : i < current() ? 'border-accent bg-accent text-white' : i === current() ? 'border-accent text-accent' : 'border-line'">
            @if (s.invalid) {
              !
            } @else if (i < current()) {
              <svg lucideIcon="check" [size]="13" />
            } @else {
              {{ i + 1 }}
            }
          </span>
          <span class="hidden md:inline">{{ s.label }}</span>
        </button>
        @if (!last) {
          <span class="h-px w-4 bg-line md:w-8" aria-hidden="true"></span>
        }
      </li>
    }
  </ol>
  <p class="mt-1 text-xs text-ink-soft md:hidden">Step {{ current() + 1 }} of {{ steps().length }}: {{ steps()[current()].label }}</p>
</nav>
