<div class="zn-modal-backdrop" (click)="closed.emit()">
  <div class="zn-modal flex flex-col" [style.width]="width()" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId"
    (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between gap-3 border-b border-line px-5 py-3.5">
      <div class="min-w-0">
        <h2 class="zn-section-title text-lg" [id]="titleId">{{ title() }}</h2>
        @if (subtitle()) {
          <p class="mt-0.5 text-xs text-ink-soft">{{ subtitle() }}</p>
        }
      </div>
      <button type="button" class="zn-icon-btn -mr-2" aria-label="Close dialog" (click)="closed.emit()">
        <svg lucideIcon="x" [size]="18" />
      </button>
    </div>
    <div class="flex-1 overflow-auto px-5 py-4"><ng-content /></div>
    <div class="flex flex-wrap justify-end gap-2 border-t border-line bg-sunken px-5 py-3 empty:hidden"><ng-content select="[modal-actions]" /></div>
  </div>
</div>
