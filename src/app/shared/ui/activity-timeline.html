@if (items().length) {
  <ol class="relative ml-2 border-l border-line">
    @for (i of items(); track $index) {
      <li class="mb-3.5 ml-4 last:mb-0">
        <span class="absolute -left-[5px] mt-1.5 h-2.5 w-2.5 rounded-full border-2 border-paper bg-accent"></span>
        @if (i.link) {
          <a [routerLink]="i.link" class="text-sm text-ink hover:text-accent hover:underline">{{ i.title }}</a>
        } @else {
          <p class="text-sm text-ink">{{ i.title }}</p>
        }
        <p class="text-xs text-ink-soft">{{ i.at | date: 'dd MMM yyyy, HH:mm' }}@if (i.subtitle) { · {{ i.subtitle }}}</p>
      </li>
    }
  </ol>
} @else {
  <p class="py-4 text-sm text-ink-soft">{{ emptyText() }}</p>
}
