<div class="flex flex-col items-center gap-2 px-4 py-10 text-center">
  <span class="flex h-11 w-11 items-center justify-center rounded-full bg-mist text-ink-soft"><svg [lucideIcon]="icon()" [size]="20" /></span>
  <p class="font-semibold text-ink">{{ title() }}</p>
  @if (message()) {
    <p class="max-w-sm text-sm text-ink-soft">{{ message() }}</p>
  }
  <div class="mt-1"><ng-content /></div>
</div>
