<app-page-header title="Training & Delegation" description="Delegation of monitor duties, acknowledgements and HOD/VP authorization.">
  @if (roles.can('delegation.manage')) {
    <a routerLink="/delegations/new" class="zn-btn zn-btn-primary"><svg lucideIcon="plus" [size]="16" /> Create Delegation Record</a>
  }
</app-page-header>
<app-filter-bar [filters]="filters()" [(search)]="search" [(values)]="filterValues" placeholder="Search ID, project, plan, monitor…" />
<app-data-table [columns]="columns" [rows]="rows()" [actions]="actions" emptyMessage="No delegation records match your filters." initialSortKey="updatedAt" />
