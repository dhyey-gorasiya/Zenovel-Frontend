<div class="flex h-dvh text-ink">
  <div class="zn-no-print hidden lg:block">
    <app-sidebar [collapsed]="collapsed()" (toggle)="collapsed.set(!collapsed())" />
  </div>

  @if (mobileOpen()) {
    <div class="fixed inset-0 z-50 lg:hidden" role="dialog" aria-modal="true" aria-label="Navigation">
      <div class="absolute inset-0 bg-black/40" (click)="mobileOpen.set(false)"></div>
      <div class="relative h-full w-64 animate-[zn-slide-in_180ms_ease]">
        <app-sidebar [mobile]="true" (navigate)="mobileOpen.set(false)" />
      </div>
    </div>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <app-topbar (menu)="mobileOpen.set(true)" (logout)="logout()" />
    @if (!storage.available()) {
      <p class="zn-no-print flex items-center gap-2 border-b border-line bg-warn-soft px-5 py-1.5 text-xs text-warn">
        <svg lucideIcon="triangle-alert" [size]="14" /> Browser storage is unavailable. Changes will be lost when you refresh this page.
      </p>
    }
    <main class="flex-1 overflow-auto p-3 md:p-5" id="main">
      <div class="mx-auto flex min-h-full max-w-[96rem] flex-col">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
