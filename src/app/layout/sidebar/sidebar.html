<aside class="flex h-full flex-col border-r border-line bg-paper transition-[width] duration-200 px-2"
  [class]="collapsed() ? 'w-[4.25rem]' : 'w-64'">
  <div class="flex items-center gap-2.5 border-b-2 border-line px-3 py-3">
    @if (collapsed()) {
    <div class="h-9 w-9 shrink-0 overflow-hidden rounded-lg dark:bg-white dark:p-0.5">
      <img src="assets/img/Zenovel-Web-Logo.svg" alt="Zenovel" class="h-full w-auto max-w-none" />
    </div>
    } @else {
    <div class="min-w-0 flex items-center justify-center">
      <div class="inline-flex rounded-md dark:bg-white dark:px-1.5 dark:py-1 p-1">
        <img src="assets/img/Zenovel-Web-Logo.svg" alt="Zenovel" class="h-10 w-auto" />
      </div>
      <!-- <div class="mt-0.5 truncate text-[0.62rem] font-semibold uppercase tracking-[0.08em] text-ink-soft">Clinical Trial
        Monitoring</div> -->
    </div>
    }
    @if (mobile()) {
    <button type="button" class="zn-icon-btn ml-auto" aria-label="Close navigation" (click)="navigate.emit()"><svg
        lucideIcon="x" [size]="18" /></button>
    }
  </div>

  <nav class="flex-1 space-y-0.5 overflow-y-auto py-2" aria-label="Main navigation">
    @for (n of items(); track n.path) {
    <a [routerLink]="n.path" routerLinkActive="active" #rla="routerLinkActive"
      [attr.aria-current]="rla.isActive ? 'page' : null" class="zn-nav-link relative"
      [title]="collapsed() ? n.label : ''" (click)="navigate.emit()">
      <svg [lucideIcon]="n.icon" [size]="18" class="shrink-0" />
      @if (!collapsed()) {
      <span class="min-w-0 flex-1 truncate">{{ n.label }}</span>
      }
      @if (n.path === '/notifications' && notifications.unreadCount() > 0) {
      @if (collapsed()) {
      <span class="absolute right-2 top-1.5 h-2 w-2 rounded-full bg-danger"></span>
      } @else {
      <span class="rounded-md bg-danger px-1.5 py-0.5 text-[0.65rem] font-bold text-white">{{
        notifications.unreadCount() }}</span>
      }
      }
    </a>
    }
  </nav>

  @if (!mobile()) {
  <button type="button" class="zn-nav-link m-2" (click)="toggle.emit()" [attr.aria-expanded]="!collapsed()"
    [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
    <svg [lucideIcon]="collapsed() ? 'panel-left-open' : 'panel-left-close'" [size]="18" class="shrink-0" />
    @if (!collapsed()) {
    <span>Collapse</span>
    }
  </button>
  }
</aside>
